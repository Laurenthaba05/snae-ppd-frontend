# À intégrer dans un serveur HTTPS configuré et revu par l’exploitant.
#
# 1. Au niveau http { } : les zones de limitation de débit par adresse du client (première ligne de défense ; le serveur applique aussi ses plafonds,
#    mais un proxy refuse avant que la requête n’atteigne l’application).
#      limit_req_zone $binary_remote_addr zone=snae_portal:10m rate=5r/s;
#      limit_req_zone $binary_remote_addr zone=snae_api:10m rate=50r/s;
#      limit_req_status 429;
# 2. Dans le serveur : TLS (TLS 1.2 au moins), un server_name précis et un serveur par défaut qui refuse les autres noms d’hôte (le serveur d’application ne se fie plus à
#    l’en-tête Host pour ses liens publics, mais un hôte inconnu n’a rien à faire ici).
# 3. Le reverse proxy doit être un proxy « interne » pour le serveur d’application (boucle locale ou réseau privé), sinon déclarer son adresse dans
#    server.tomcat.remoteip.internal-proxies : le serveur d’application ne croit X-Forwarded-For que d’un proxy interne, et en tire l’adresse du client pour ses plafonds.

# Routes publiques du portail (sans compte) : corps courts, débit limité par adresse.
location /api/v1/portal/ {
    limit_req zone=snae_portal burst=20 nodelay;
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "no-store" always;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
}

# Le reste de l’API : les corps JSON et XML sont plafonnés à 16 Mio par le serveur ; seuls les envois de fichiers (64 Mio par défaut côté serveur) dépassent quelques Mio.
location /api/ {
    limit_req zone=snae_api burst=100 nodelay;
    client_max_body_size 70m;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "no-store" always;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
}

# L’application : la politique de sécurité du contenu est déjà dans la page (balise <meta>, calculée à la construction avec l’origine du fournisseur d’identité) ;
# ici, ce qu’une balise ne peut pas dire : interdire l’affichage dans le cadre d’un autre site, HSTS, et les fonctions du navigateur dont l’application n’a pas besoin.
location / {
    root /srv/snae/frontend;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
}
