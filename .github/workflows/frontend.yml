name: Frontend F1.1
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require reviewed lockfile
        run: test -f package-lock.json || (echo "Generate and review package-lock.json in a connected environment first"; exit 1)
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-f1-1
          path: dist/
